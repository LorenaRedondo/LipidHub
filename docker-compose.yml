services:
  api:
    build:
      context: .
      target: api
    ports:
      - "8787:8787"
    environment:
      API_PORT: "8787"
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "5174:80"
    restart: unless-stopped

  mcp:
    build:
      context: .
      target: api
    command: ["npx", "tsx", "mcp/httpServer.ts"]
    ports:
      - "8788:8788"
    environment:
      MCP_HTTP_PORT: "8788"
      MCP_API_KEYS: ${MCP_API_KEYS}
    restart: unless-stopped
